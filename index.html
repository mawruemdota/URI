function nextWizard(){if(step===1&&(!wizard.name1.trim()||(wizard.type==='Wedding'&&!wizard.name2.trim()))){alert('Please enter the required name fields.');return}if(step===2){if(!wizard.date||!wizard.time||!wizard.venue.trim()){alert('Please enter the event date, time, and venue.');return}const today=new Date();const localToday=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');if(wizard.date<localToday){alert('Please choose a current or future event date.');return}}if(step===4&&wizard.deadline&&wizard.date&&wizard.deadline>wizard.date){alert('The RSVP deadline must not be after the event date.');return}if(step<5){wizardStep(step+1);return}let e={...wizard,id:'e'+Date.now().toString(36),guests:[],created:Date.now()};state.events.push(e);state.current=e.id;save();clearWizard();tab='overview';route('event')}function dashboard(){app.innerHTML='<div class="wrap"><div class="eyebrow">Your workspace</div><h2>My Events</h2><p>Manage your invitations and RSVP responses. Saved in this browser only.</p><div class="actions"><button class="btn primary" onclick="startWizard()">+ Create wedding website</button></div><div class="templates" style="margin-top:24px">'+(state.events.length?state.events.map(e=>'<div class="card"><div class="template-preview" style="background:'+template(e).bg+';color:'+template(e).ink+'">'+esc(title(e))+'</div><h3>'+esc(title(e))+'</h3><p>'+esc(fmt(e.date))+' · '+esc(e.status)+'</p><button class="btn primary small" onclick="state.current=\''+e.id+'\';save();tab=\'overview\';route(\'event\')">Manage event</button></div>').join(''):'<div class="card"><h3>No invitations yet</h3><p>Create your first event to get started.</p></div>')+'</div></div>'}function eventPage(){let e=current();if(!e){route('dashboard');return}if(e._uriCloudOwnerId&&e._uriCloudOwnerId!==window.URICloudDrafts?.getUser?.()?.id){route('cloud');return}const confirmed=e.guests.filter(g=>g.status==='attending').length,declined=e.guests.filter(g=>g.status==='declined').length,pending=e.guests.length-confirmed-declined;let inner='';if(tab==='overview')inner='<div class="eyebrow">Event overview</div><h2>'+esc(title(e))+'</h2><p>'+esc(fmt(e.date))+' · '+esc(e.status)+'</p><div class="stats">'+[['Invited',e.guests.length],['Attending',confirmed],['Pending',pending],['Declined',declined]].map(([k,v])=>'<div class="stat"><strong>'+v+'</strong><span>'+k+'</span></div>').join('')+'</div><div class="panel"><h3>Ready to make it yours?</h3><p>Customize the invitation, add guests, and test your RSVP flow.</p><div class="actions"><button class="btn primary" onclick="tab=\'edit\';eventPage()">Edit invitation</button><button class="btn" onclick="tab=\'guests\';eventPage()">Manage guests</button></div></div>'+(e.type==='Wedding'&&window.URIReadiness?window.URIReadiness.summary(e):'')+(e.type==='Wedding'&&window.URIGuests?window.URIGuests.summary(e):'');if(tab==='edit')inner='<h2>Edit invitation</h2><p>Changes are saved automatically to this browser.</p><div class="editor"><div class="panel">'+[['name1','First name'],['name2','Second name'],['title','Invitation title'],['date','Date'],['time','Time'],['venue','Venue'],['address','Address'],['message','Message']].filter(([k])=>k!=='name2'||e.type==='Wedding').map(([k,l])=>'<div class="field"><label>'+l+'</label><input type="'+(k==='date'?'date':k==='time'?'time':'text')+'" value="'+esc(e[k])+'" oninput="editEvent(\''+k+'\',this.value)"></div>').join('')+'<div class="field"><label>Template</label><select onchange="editEvent(\'template\',this.value)">'+TEMPLATES.map(t=>'<option value="'+t.id+'" '+(t.id===e.template?'selected':'')+'>'+t.name+'</option>').join('')+'</select></div></div><div class="preview-area" id="livePreview">'+inv(e)+'</div></div>';if(tab==='guests')inner=window.URIGuests&&e.type==='Wedding'?window.URIGuests.panel(e):'<h2>Guest management</h2><p>Add guests and generate a testing link for each person.</p><div class="panel"><form onsubmit="addGuest(event)"><div class="grid2"><div class="field"><label>Guest name</label><input name="guestName" required placeholder="e.g. Sofia Cruz"></div><div class="field"><label>Group (optional)</label><input name="group" placeholder="e.g. Cruz Family"></div></div><button class="btn primary">+ Add guest</button></form></div><div class="panel" style="margin-top:18px;overflow-x:auto"><table class="list"><thead><tr><th>Name</th><th>Group</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+(e.guests.length?e.guests.map(g=>'<tr><td>'+esc(g.name)+'</td><td>'+esc(g.group||'—')+'</td><td><span class="pill">'+esc(g.status)+'</span></td><td><button class="btn small" onclick="copyGuest(\''+g.id+'\')">Copy link</button> <button class="btn small" onclick="removeGuest(\''+g.id+'\')">Remove</button></td></tr>').join(''):'<tr><td colspan="4" class="empty">No guests added yet</td></tr>')+'</tbody></table></div>';if(tab==='share')inner=e.type==='Wedding'?'<h2>Preview & sharing</h2><p>Check your full wedding website before publishing. This preview uses the information saved in your browser.</p><div class="panel"><h3>Wedding website preview</h3><p>See every enabled section and switch between desktop and mobile sizes.</p><div class="actions"><button class="btn primary" onclick="uriFlowOpenPreview(\'event\')">Open full preview </button><button class="btn" onclick="tab=\'edit\';eventPage();uriBPanel(\'publish\')">Publishing settings (beta)</button></div></div><div class="banner notice">Do not send the local test guest links to real guests. Secure RSVP and invitation delivery are still in development.</div>':'<h2>Preview & sharing</h2><div class="banner notice">Prototype notice: links only work with event data saved in the same browser. Do not send these links to real guests yet.</div><div class="editor"><div class="preview-area">'+inv(e)+'</div><div class="panel"><h3>Invitation status</h3><p>Current: '+esc(e.status)+'</p><button class="btn primary" onclick="editEvent(\'status\',\''+(e.status==='published'?'draft':'published')+'\');eventPage()">'+(e.status==='published'?'Unpublish':'Publish for local testing')+'</button><h3>Test invitation</h3><p>Open a guest link from Guest management to test RSVP. Links are not production-ready.</p></div></div>';if(tab==='analytics')inner=window.URIGuests&&e.type==='Wedding'?window.URIGuests.analytics(e):'<h2>RSVP overview</h2><div class="stats">'+[['Invited',e.guests.length],['Attending',confirmed],['Pending',pending],['Declined',declined]].map(([k,v])=>'<div class="stat"><strong>'+v+'</strong><span>'+k+'</span></div>').join('')+'</div><div class="panel"><h3>Responses</h3><p>Live counts based on locally stored test responses.</p></div>';app.innerHTML='<div class="wrap"><div class="actions" style="margin:0 0 22px"><button class="btn ghost" onclick="route(\'dashboard\')"> All events</button><span class="chip">'+esc(e.type)+' · '+esc(e.status)+'</span></div><div class="workspace"><div class="sidebar">'+[['overview','Overview'],['edit','Edit invitation'],['guests','Guests & RSVP'],['share','Preview & share'],['analytics','Analytics']].map(([id,n])=>'<button class="'+(tab===id?'active':'')+'" onclick="tab=\''+id+'\';eventPage()">'+n+'</button>').join('')+'</div><div>'+inner+'</div></div></div>'}function editEvent(k,v){let e=current();e[k]=v;save();if(tab==='edit'){let p=document.getElementById('livePreview');if(p)p.innerHTML=inv(e)}}function addGuest(ev){ev.preventDefault();let f=ev.target,e=current(),name=f.guestName.value.trim();if(!name)return;e.guests.push({id:'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),name,group:f.group.value.trim(),status:'pending'});save();eventPage()}function removeGuest(id){if(!confirm('Remove this guest?'))return;let e=current();e.guests=e.guests.filter(g=>g.id!==id);save();eventPage()}function copyGuest(id){let e=current(),url=location.href.split('#')[0]+'#invite/'+e.id+'.'+id;if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(url).then(()=>alert('Test link copied. It only works in this browser.')).catch(()=>prompt('Copy test link:',url))}else{prompt('Copy test link:',url)}}function guestPage(token){if(window.URIGuests&&state.events.find(x=>x.id===decodeURIComponent(String(token).split('.')[0]))?.type==='Wedding')return window.URIGuests.guestPage(token);let [eid,gid]=token.split('.'),e=state.events.find(x=>x.id===eid),g=e?.guests.find(x=>x.id===gid);if(!e||!g){app.innerHTML='<div class="wrap center"><h2>Invitation not available</h2><p>This test invitation is not stored in this browser.</p><button class="btn" onclick="route(\'home\')">Back to URI</button></div>';return}app.innerHTML='<div class="wrap" style="max-width:640px"><div class="center"><div class="eyebrow">A personal invitation for '+esc(g.name)+'</div><h2>You’re invited</h2></div><div class="preview-area">'+inv(e)+'</div><div class="panel" style="margin-top:20px"><h3>Will you join us, '+esc(g.name)+'?</h3><p>We would love to celebrate with you.</p><div class="actions"><button class="btn '+(g.status==='attending'?'primary':'')+'" onclick="respond(\''+eid+'\',\''+gid+'\',\'attending\')">Joyfully accepts</button><button class="btn '+(g.status==='declined'?'primary':'')+'" onclick="respond(\''+eid+'\',\''+gid+'\',\'declined\')">Regretfully declines</button></div><div class="banner">Current RSVP: '+esc(g.status)+' · This is a same-browser test only.</div></div></div>'}function respond(eid,gid,s){let e=state.events.find(x=>x.id===eid),g=e?.guests.find(x=>x.id===gid);if(!g)return;g.status=s;g.respondedAt=Date.now();save();guestPage(eid+'.'+gid)}window.addEventListener('hashchange',()=>{if(window.__uriLastRenderedHash!==location.hash)render()});render();
