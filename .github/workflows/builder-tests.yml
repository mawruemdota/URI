name: URI Builder Checks
on:
  push:
  pull_request:
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run modular builder smoke tests
        run: node tests/builder-smoke.cjs
      - name: Run wedding setup and editor flow smoke tests
        run: node tests/wedding-flow-smoke.cjs
      - name: Check wedding template visual structure and modular behavior
        run: node tests/wedding-template-smoke.cjs
      - name: Check scaled preview fidelity and creator UI polish
        run: node tests/ui-polish-smoke.cjs
