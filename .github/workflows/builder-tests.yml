name: URI Builder Checks
on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
concurrency:
  group: uri-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run modular builder smoke tests
        run: node tests/builder-smoke.cjs
      - name: Run wedding setup and editor flow smoke tests
        run: node tests/wedding-flow-smoke.cjs
      - name: Check wedding template visual structure and modular behavior
        run: node tests/wedding-template-smoke.cjs
      - name: Check scaled preview fidelity and creator UI polish
        run: node tests/ui-polish-smoke.cjs
      - name: Test every feature and layout variation
        run: node tests/template-matrix.cjs
      - name: Verify adaptive section composition and template reflow
        run: node tests/dynamic-sections-smoke.cjs
      - name: Verify custom section creation and template recipes
        run: node tests/custom-builder-smoke.cjs
      - name: Verify animation manager presets, persistence and reduced motion
        run: node tests/animation-smoke.cjs
      - name: Verify theme backgrounds and music playlist safety
        run: node tests/theme-media-smoke.cjs
      - name: Verify Nightfall cinematic wedding template
        run: node tests/nightfall-template-smoke.cjs
      - name: Test optional wedding photo uploads and draft recovery
        run: node tests/wizard-photo-smoke.cjs
      - name: Verify Photo Manager 2.0 crop, zoom and reorder
        run: node tests/photo-manager-smoke.cjs
      - name: Verify wedding details and dashboard management
        run: node tests/details-dashboard-smoke.cjs
      - name: Verify readiness, direct edits and local RSVP 2.0
        run: node tests/experience-smoke.cjs
      - name: Verify direct preview focus targets and edit buttons
        run: node tests/inline-edit-smoke.cjs
      - name: Test storage recovery and async photo isolation
        run: node tests/qa-hardening.cjs

  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.56.1-${{ runner.os }}-ubuntu24
      - name: Install Chromium test driver
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise the real wedding builder in Chromium
        run: node tests/browser-wedding.cjs
      - name: Preserve screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uri-wedding-browser-screenshots
          path: artifacts/wedding-browser/
          if-no-files-found: ignore
          retention-days: 14
